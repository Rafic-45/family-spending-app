name: Flutter CI

on:
  push:
    branches: [main, master, claude/adoring-ride-6ve4gh]
  pull_request:
    branches: [main, master, claude/adoring-ride-6ve4gh]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ folder is generated (not committed) so it always matches the
      # CI Flutter version. This creates it without touching lib/ or pubspec.yaml.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name family_spend .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-spend-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publish the APK where it can actually be downloaded: a GitHub Release
      # (a tappable link) and a lightweight apk-dist branch (one binary only).
      - name: Publish APK (release + apk-dist branch)
        if: github.ref_name == 'claude/adoring-ride-6ve4gh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk

          # 1) GitHub Release with a stable tag -> direct download link.
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$APK#family-spend.apk" \
            --target "$GITHUB_SHA" \
            --title "Family Spend — latest APK" \
            --notes "Debug-signed release APK built by CI. Android only. Enable 'install unknown apps' to install."

          # 2) Orphan apk-dist branch holding just the APK, so it can be fetched.
          cp "$APK" family-spend.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -r --cached . -q || true
          git add -f family-spend.apk
          git commit -m "APK build for $GITHUB_SHA"
          git push -f origin apk-dist
