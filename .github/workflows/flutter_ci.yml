name: Flutter CI

on:
  push:
    branches: [main, master, claude/adoring-ride-6ve4gh]
  pull_request:
    branches: [main, master, claude/adoring-ride-6ve4gh]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ folder is generated (not committed) so it always matches the
      # CI Flutter version. This creates it without touching lib/ or pubspec.yaml.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name family_spend .

      # Flutter's template only puts the INTERNET permission in the debug/profile
      # manifests, so release APKs can't reach the network. Add it to the main one.
      - name: Ensure INTERNET permission in release manifest
        run: |
          set -euo pipefail
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            perl -0777 -pi -e 's/(<manifest\b[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$M"
          fi
          echo "----- $M (head) -----"
          sed -n '1,12p' "$M"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Split per ABI so each APK is small (the universal APK is ~50 MB; the
      # arm64-v8a one — virtually all modern phones — is ~15 MB).
      - name: Build APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: family-spend-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Publish the APKs where they can actually be downloaded: a GitHub Release
      # (tappable links) and a lightweight apk-dist branch (one small binary).
      - name: Publish APK (release + apk-dist branch)
        if: github.ref_name == 'claude/adoring-ride-6ve4gh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIR=build/app/outputs/flutter-apk
          ARM64="$DIR/app-arm64-v8a-release.apk"

          # 1) GitHub Release with every ABI variant -> direct download links.
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$DIR"/*.apk \
            --target "$GITHUB_SHA" \
            --title "Family Spend — latest APK" \
            --notes "Debug-signed release APKs built by CI. Android only. Most phones: app-arm64-v8a-release.apk. Enable 'install unknown apps' to install."

          # 2) Orphan apk-dist branch holding the small arm64 APK, so it can be fetched.
          cp "$ARM64" family-spend-arm64.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -r --cached . -q || true
          git add -f family-spend-arm64.apk
          git commit -m "APK build for $GITHUB_SHA"
          git push -f origin apk-dist
