name: Flutter CI

on:
  push:
    branches: [main, master, claude/adoring-ride-6ve4gh]
  pull_request:
    branches: [main, master, claude/adoring-ride-6ve4gh]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ folder is generated (not committed) so it always matches the
      # CI Flutter version. This creates it without touching lib/ or pubspec.yaml.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name family_spend .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-spend-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
